; XC_VM Configuration — EXAMPLE
; -----------------------------
; This is a template only. On a real install the file is written for you by
; ./install with freshly generated database credentials (see /root/credentials.txt
; on the target server). Copy this file to config/config.ini ONLY if you are
; wiring XC_VM to an existing database by hand.
;
; To change your username or password, modify BOTH
; below and XC_VM will read and re-encrypt them.

[XC_VM]
hostname    =   "127.0.0.1"
database    =   "xc_vm"
port        =   3306
server_id   =   1

[Encrypted]
username    =   "REPLACE_WITH_DB_USERNAME"
password    =   "REPLACE_WITH_DB_PASSWORD"
